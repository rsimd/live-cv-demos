[project]
name = "live-cv-demos"
version = "0.1.0"
description = "CPU-friendly live computer vision demos for open-campus exhibits."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.24",
    "jaxtyping>=0.2.36",
    "mediapipe==0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10",
    "torch>=2.3",
    "torchvision>=0.18",
    "ultralytics>=8.3",
]

[project.scripts]
sfcv-demo = "sfcv_demo.app:main"
sfcv-airdraw = "sfcv_airdraw.app:main"
live-cv-demo = "sfcv_demo.app:main"
live-cv-airdraw = "sfcv_airdraw.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfcv_demo", "src/sfcv_airdraw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
